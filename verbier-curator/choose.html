<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose your role — Verbier Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600;700&display=swap"
  rel="stylesheet">
<link rel="icon" type="image/svg+xml"
  href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎼</text></svg>">
<link rel="stylesheet" href="/page-location.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #050a18;
    color: #fff;
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }

  .choose-screen {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    width: 100vw;
  }

  /* ── Panels ── */
  .choose-panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    overflow: hidden;
    transition: filter 0.4s ease;
    border: none;
    text-align: center;
    padding: 0;
    color: #fff;
    background: transparent;
    text-decoration: none;     /* anchor reset */
  }
  .choose-panel:hover { filter: brightness(1.18); }
  .choose-panel:hover .orb-outer { transform: scale(1.08); }
  .choose-panel:hover .panel-bg-decor { opacity: 0.85; }
  .choose-panel:focus-visible { outline: 2px solid currentColor; outline-offset: -10px; }

  .choose-panel.become {
    background: radial-gradient(ellipse at 50% 80%, #4f1ea3 0%, #1f0945 35%, #0a041a 70%, #050a18 100%);
  }
  .choose-panel.follow {
    background: radial-gradient(ellipse at 50% 80%, #1a4ca3 0%, #0b2347 35%, #04101d 70%, #050a18 100%);
  }

  /* Decorative background art — Verbier archive imagery, heavily filtered
     so the orb + title still pop. Subtle Ken-Burns drift keeps the page
     feeling alive without competing for attention. */
  .panel-bg-decor {
    position: absolute;
    inset: -20px;
    pointer-events: none;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0.55;
    /* Source images have baked-in horizontal black borders. After the
       follow-panel's invert filter those become bright white bands at top
       and bottom of the panel, so we scale up aggressively to crop them. */
    transform: scale(1.55);
    transition: opacity 0.5s ease, transform 12s ease;
    animation: panel-bg-drift 24s ease-in-out infinite alternate;
  }
  .choose-panel.become .panel-bg-decor {
    background-image: url("/verbier-photos/2022/CONCERTS/15072022_Combins_Noseda%26Fedorova%26VFO/Mainstage/150722_Combins_NOSEDA_FEDOROVA_%40LucienGrandjean/HD/15072022_19h_salledescombins_%C2%A9LucienGrandjean-15_noseda_fedorova_vfo.jpg");
    filter: saturate(0.7) brightness(0.4) hue-rotate(-12deg);
    mix-blend-mode: lighten;
  }
  /* Right panel uses an annotated score image which is paper-white in the
     background. Inverting + hue-rotating turns the white sheet into deep
     blue and the dark notes into glowing light, matching the panel palette. */
  .choose-panel.follow .panel-bg-decor {
    background-image: url("/choose-bg-follow.jpg");
    filter: invert(1) hue-rotate(180deg) saturate(0.85) brightness(0.75) contrast(0.85);
    opacity: 0.4;
    mix-blend-mode: lighten;
  }
  @keyframes panel-bg-drift {
    0%   { transform: scale(1.55) translate(0, 0); }
    100% { transform: scale(1.62) translate(-1%, -1.5%); }
  }
  .choose-panel:hover .panel-bg-decor { opacity: 0.78; }
  /* Subtle particle field via repeating radial-gradient — pure CSS placeholder */
  .panel-bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.9), transparent 50%),
      radial-gradient(1px 1px at 75% 15%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(2px 2px at 88% 65%, rgba(255,255,255,0.9), transparent 50%),
      radial-gradient(1px 1px at 12% 60%, rgba(255,255,255,0.6), transparent 50%),
      radial-gradient(1px 1px at 60% 45%, rgba(255,255,255,0.7), transparent 50%),
      radial-gradient(2px 2px at 50% 20%, rgba(255,255,255,0.85), transparent 50%),
      radial-gradient(1px 1px at 30% 10%, rgba(255,255,255,0.55), transparent 50%);
    background-size: 100% 100%;
    animation: drift 60s linear infinite;
  }
  @keyframes drift {
    from { background-position: 0 0; }
    to   { background-position: 30% 20%; }
  }

  /* Title */
  .choose-title {
    position: relative;
    z-index: 2;
    margin-top: clamp(60px, 12vh, 140px);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 2.6vw, 2.6rem);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .choose-panel.become .choose-title {
    color: #d8a8ff;
    text-shadow: 0 0 40px rgba(190, 100, 255, 0.7), 0 0 12px rgba(255,255,255,0.5);
  }
  .choose-panel.follow .choose-title {
    color: #a8d8ff;
    text-shadow: 0 0 40px rgba(100, 180, 255, 0.7), 0 0 12px rgba(255,255,255,0.5);
  }

  /* Subtitle */
  .choose-subtitle {
    position: relative;
    z-index: 2;
    margin-top: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.9rem, 1.1vw, 1.1rem);
    color: rgba(255, 255, 255, 0.55);
    max-width: 360px;
    line-height: 1.5;
    padding: 0 20px;
  }

  /* Orb */
  .orb-outer {
    position: relative;
    z-index: 2;
    margin-top: auto;
    margin-bottom: clamp(80px, 18vh, 160px);
    width: clamp(80px, 9vw, 130px);
    height: clamp(80px, 9vw, 130px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.4s ease;
  }
  .choose-panel.become .orb-outer {
    background:
      radial-gradient(circle at center, rgba(190, 110, 255, 0.45) 0%, rgba(190, 110, 255, 0.0) 70%);
    box-shadow: 0 0 80px rgba(190, 100, 255, 0.55), inset 0 0 20px rgba(190, 100, 255, 0.3);
    color: #d8a8ff;
  }
  .choose-panel.follow .orb-outer {
    background:
      radial-gradient(circle at center, rgba(110, 180, 255, 0.45) 0%, rgba(110, 180, 255, 0.0) 70%);
    box-shadow: 0 0 80px rgba(100, 180, 255, 0.55), inset 0 0 20px rgba(100, 180, 255, 0.3);
    color: #a8d8ff;
  }
  .orb-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0.85;
    animation: orb-pulse 3s ease-in-out infinite;
  }
  .orb-ring.outer {
    inset: -20px;
    border-width: 1px;
    opacity: 0.35;
    animation-delay: 0.4s;
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.08); opacity: 0.4; }
  }
  .orb-core {
    width: 60%;
    height: 60%;
    border-radius: 50%;
    border: 2px solid currentColor;
    background: rgba(255,255,255,0.18);
    box-shadow: 0 0 24px rgba(255,255,255,0.4), inset 0 0 16px rgba(255,255,255,0.2);
  }

  /* Divider line down the center */
  .choose-screen::after {
    content: '';
    position: absolute;
    top: 12vh;
    bottom: 12vh;
    left: 50%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.15), transparent);
    pointer-events: none;
  }
  .choose-screen { position: relative; }

  /* Tiny back link in top-left */
  .choose-back {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 10;
    color: rgba(255,255,255,0.5);
    text-decoration: none;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    transition: color 0.2s;
  }
  .choose-back:hover { color: rgba(255,255,255,0.9); }
</style>
</head>
<body>

<div class="page-location">
  <span>Verbier Festival</span>
  <span class="loc-sep">·</span>
  <span class="loc-current">Choose Your Path</span>
</div>

<a class="choose-back" href="/">← Back</a>

<div class="choose-screen">

  <a class="choose-panel become" href="/lens-app.html" aria-label="Become the Conductor">
    <div class="panel-bg-particles"></div>
    <div class="panel-bg-decor" id="bg-decor-become"></div>
    <div class="choose-title">Become<br/>the Conductor</div>
    <div class="choose-subtitle">Real-time gestural reorchestration of Verbier recordings.</div>
    <div class="orb-outer">
      <div class="orb-ring"></div>
      <div class="orb-ring outer"></div>
      <div class="orb-core"></div>
    </div>
  </a>

  <a class="choose-panel follow" href="/follow.html" aria-label="Follow the Conductor">
    <div class="panel-bg-particles"></div>
    <div class="panel-bg-decor" id="bg-decor-follow"></div>
    <div class="choose-title">Follow<br/>the Conductor</div>
    <div class="choose-subtitle">Watch the score come alive alongside a Verbier performance.</div>
    <div class="orb-outer">
      <div class="orb-ring"></div>
      <div class="orb-ring outer"></div>
      <div class="orb-core"></div>
    </div>
  </a>

</div>

</body>
</html>
